[workspace]
name = "mae345"
description = "ROB 345/549 (Princeton, F2026) lab env — conda-forge port of env-mae345.yml"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.9.*"
sympy = "*"
numpy = "*"
scipy = "==1.5.2"
matplotlib = "*"
notebook = "*"
jupyterlab = "*"
opencv = "*"
widgetsnbextension = "*"
ipympl = "*"
nodejs = "*"
pip = ">=25.2,<26"

[tasks]
lab = "jupyter lab"
notebook = "jupyter notebook"

# ── SITL simulation env (CrazySim + MuJoCo) ──────────────────────────────────
# A drop-in stand-in for the physical Crazyflie: the real firmware runs on the
# host and speaks cflib over udp://127.0.0.1:19850. Separate from the py3.9 lab
# env because cflib requires Python >= 3.10.
[feature.sim.dependencies]
python = "3.11.*"
numpy = "*"
mujoco = "*"
jinja2 = "*"
cmake = "*"
make = "*"

[feature.sim.pypi-dependencies]
cflib = ">=0.1.33"

# GCC 14+ promoted several formerly-warning C idioms (implicit function
# declarations, int<->pointer conversions, ...) to errors by default. The SITL
# firmware predates that; upstream builds it with gcc ~11/12. Downgrade them so
# the system gcc 16 can compile it. CMake seeds CMAKE_C_FLAGS from $CFLAGS on the
# first configure, so this only takes effect in a fresh sitl_make/build/.
[feature.sim.activation.env]
CFLAGS = "-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=return-mismatch -Wno-error=declaration-missing-parameter-type"

[feature.sim.tasks]
# Only `cf2` (the SITL firmware); `make all` also pulls in the Gazebo plugin
# target (crazysim_gz), which needs Gazebo and isn't used by the MuJoCo backend.
sim-build = { cmd = "mkdir -p sitl_make/build && cd sitl_make/build && cmake .. && make -j cf2", cwd = "worlds/mujoco/dependencies/CrazySim/crazyflie-firmware" }
sim = { cmd = "bash tools/crazyflie-simulation/simulator_files/mujoco/launch/sitl_singleagent.sh -m cf2x_T350 -x 0 -y 0", cwd = "worlds/mujoco/dependencies/CrazySim/crazyflie-firmware" }
# Same as `sim`, but loads the example Lab 2 pipe course (worlds/mujoco/scene_course.xml).
# Runs from the repo root (no `cwd`) so the relative --scene path resolves there.
sim-course = { cmd = "bash worlds/mujoco/dependencies/CrazySim/crazyflie-firmware/tools/crazyflie-simulation/simulator_files/mujoco/launch/sitl_singleagent.sh -m cf2x_T350 -x 0 -y 0 -s worlds/mujoco/scene_course.xml" }

# ── Notebook layer for Lab 2 ─────────────────────────────────────────────────
# Makes the simulator's py3.11 stack (feature.sim) usable as a Jupyter kernel, so
# ONE environment runs the whole Lab 2 notebook (Parts I-IV) *and* the sim server.
# Composed on top of feature.sim rather than editing it, so the `sim` env is
# untouched. `packaging < 26` is required: cflib pins packaging~=25.0, and conda
# ipykernel would otherwise drag in packaging 26.x and break the pypi solve.
[feature.notebook.dependencies]
matplotlib = "*"
ipykernel = "*"
packaging = ">=25,<26"

[environments]
sim = { features = ["sim"], no-default-feature = true }
lab2 = { features = ["sim", "notebook"], no-default-feature = true }

[pypi-dependencies]
cflib = ">=0.1.13.1, <0.2"
libusb = ">=1.0.27.post4, <2"
cfclient = ">=2019.9, <2020"
